# Second safety net against the Supabase pause (7 days without activity), on top
# of the Netlify scheduled function: calls keepalive_ping once a day.
# Repo secrets: SUPABASE_URL and SUPABASE_ANON_KEY (the anon / publishable key is enough).
name: keepalive

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
