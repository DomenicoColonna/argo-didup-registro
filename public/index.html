<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="cache-control" content="no-store">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Registro">
<title>Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          page: '#f4f5fa',
          ink: { DEFAULT: '#161a2b', soft: '#5b6178', faint: '#6b7189' },
        },
        // the UI is flat: this is the only shadow, for what floats (dropdown, dialogs)
        boxShadow: {
          pop: '0 0 0 1px rgba(22,26,43,.05), 0 16px 40px -16px rgba(22,26,43,.28)',
        },
      },
    },
  };
</script>
<style>
  :root { --sai: env(safe-area-inset-bottom, 0px); }
  html, body { background-color: #fff; }
  body { overscroll-behavior-y: none; }
  dialog:not([open]) { display: none; }
  body { -webkit-font-smoothing: antialiased; }
  .field {
    margin-top: .375rem; width: 100%; border-radius: .5rem; background: #fff; color: #161a2b;
    border: 1px solid #e2e8f0; padding: .65rem .8rem; font-size: 15px;
    outline: 2px solid transparent; outline-offset: -1px; transition: border-color .15s, outline-color .15s;
  }
  .field::placeholder { color: #6b7189; }
  .field:hover { border-color: #cbd5e1; }
  .field:focus { border-color: #7c3aed; outline-color: #7c3aed; }
  .btn {
    border-radius: .5rem; padding: .575rem .875rem; font-weight: 600; border: 1px solid transparent;
    transition: background-color .15s, transform .15s;
  }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }
  .btn-primary { background: #7c3aed; color: #fff; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-quiet { background: #fff; color: #161a2b; border-color: #e2e8f0; }
  .btn-quiet:hover { background: #f4f5fa; }
  .btn-danger { background: #e11d48; color: #fff; }
  .btn-danger:hover { background: #be123c; }
  .btn-ghost-danger { color: #e11d48; }
  .btn-ghost-danger:hover { background: #fff1f2; }
  .modal {
    padding: 0; border-radius: .875rem; background: #fff; color: #161a2b;
    box-shadow: 0 0 0 1px rgba(22,26,43,.05), 0 16px 40px -16px rgba(22,26,43,.28);
  }
  .modal::backdrop { background: rgba(22,26,43,.4); }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .enter { animation: enter .35s cubic-bezier(.16,1,.3,1) both; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  @keyframes slide-forward { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes slide-back { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .slide-forward { animation: slide-forward .28s cubic-bezier(.16,1,.3,1) both; }
  .slide-back { animation: slide-back .28s cubic-bezier(.16,1,.3,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .enter, .slide-forward, .slide-back { animation: none; }
  }
</style>
</head>
<body class="bg-white text-ink font-sans">

<!-- -------------------------------------------------------------- BOOT -->
<!-- shown while the saved session is checked, so the login form never flashes
     for someone who is already signed in -->
<div id="boot-view" class="min-h-screen grid place-items-center p-5 bg-white">
  <div class="flex flex-col items-center gap-4" role="status" aria-live="polite">
    <img src="/logo.svg" alt="" width="52" height="52" class="animate-pulse">
    <p class="text-sm font-semibold text-ink-soft">Apro il registro…</p>
  </div>
</div>

<!-- ------------------------------------------------------------- LOGIN -->
<div id="login-view" hidden class="hidden min-h-screen grid place-items-center px-6 py-10 bg-white">
  <form id="login-form" class="w-full max-w-[22rem] enter">
    <img src="/logo.svg" alt="" width="44" height="44">
    <h1 class="mt-6 text-[28px] leading-tight font-extrabold tracking-tight">Il tuo registro</h1>
    <p class="mt-1.5 text-[15px] text-ink-soft">Accedi con le credenziali di didUP Famiglia.</p>

    <div class="mt-8 space-y-4">
      <label class="block">
        <span class="text-[13px] font-semibold text-ink-soft">Codice scuola</span>
        <input name="schoolCode" required placeholder="SS12345" autocomplete="off" autocapitalize="characters"
          class="field">
      </label>
      <label class="block">
        <span class="text-[13px] font-semibold text-ink-soft">Utente</span>
        <input name="username" required autocomplete="username" class="field">
      </label>
      <label class="block">
        <span class="text-[13px] font-semibold text-ink-soft">Password</span>
        <input name="password" type="password" required autocomplete="current-password" class="field">
      </label>
    </div>

    <button id="login-btn" class="btn btn-primary w-full mt-6 py-3">Accedi</button>
    <p id="login-error" class="hidden mt-4 text-sm text-rose-700 border border-rose-200 rounded-lg px-3.5 py-2.5"></p>
    <p class="mt-5 text-xs text-ink-faint leading-relaxed">
      Le credenziali servono solo per ottenere il token e non vengono salvate su disco.
    </p>
  </form>
</div>

<!-- --------------------------------------------------------------- APP -->
<div id="app-view" class="hidden min-h-screen pb-28 lg:pb-14 lg:pl-60">

  <!-- title and summary change with the tab, see setHeader in app.js -->
  <header class="max-w-3xl lg:max-w-5xl mx-auto px-5 pt-6 lg:px-12 lg:pt-11">
    <div class="flex flex-wrap items-center gap-x-2 gap-y-4">
      <button id="header-back" type="button" aria-label="Torna alla home" data-icon="arrowLeft"
        class="hidden lg:hidden order-1 -ml-2.5 w-10 h-10 shrink-0 grid place-items-center rounded-lg
               text-ink-soft hover:bg-page transition focus-visible:outline focus-visible:outline-2
               focus-visible:outline-violet-600"></button>
      <div class="order-1 min-w-0 flex-1">
        <h1 id="page-title" class="text-[28px] lg:text-[32px] leading-tight font-extrabold tracking-tight truncate"></h1>
        <p id="page-meta" class="text-sm text-ink-soft mt-0.5 truncate"></p>
      </div>
      <div class="order-2 lg:order-3 flex items-center -mr-2.5 lg:mr-0">
        <button id="refresh-btn" title="Aggiorna i dati" aria-label="Aggiorna i dati"
          class="w-10 h-10 grid place-items-center rounded-lg text-ink-soft hover:bg-page hover:text-ink transition
                 focus-visible:outline focus-visible:outline-2 focus-visible:outline-violet-600"
          data-icon="refresh"></button>
        <button id="logout-btn" data-action="logout" title="Esci" aria-label="Esci"
          class="lg:hidden w-10 h-10 grid place-items-center rounded-lg text-ink-soft hover:bg-rose-50
                 hover:text-rose-600 transition focus-visible:outline focus-visible:outline-2
                 focus-visible:outline-rose-500"
          data-icon="logout"></button>
      </div>
      <!-- on mobile it wraps under the title, on desktop it fits on the same row -->
      <div id="header-menu-row" class="order-3 lg:order-2 w-full lg:w-auto">
        <div id="header-menu" class="relative inline-block text-left max-w-full lg:max-w-xs">
          <button id="header-menu-btn" type="button" aria-haspopup="listbox" aria-expanded="false"
            class="flex items-center gap-2 max-w-full text-sm font-semibold border border-slate-200 hover:bg-page
                   rounded-lg pl-3.5 pr-2.5 py-2 transition focus-visible:outline focus-visible:outline-2
                   focus-visible:outline-offset-2 focus-visible:outline-violet-600">
            <span id="header-menu-label" class="min-w-0 truncate">Intero anno</span>
            <span id="header-menu-chevron" class="shrink-0 text-ink-soft transition-transform duration-200"
                  data-icon="chevronDown" data-icon-size="w-4 h-4"></span>
          </button>
          <div id="header-menu-list" hidden role="listbox" aria-label="Periodo"
            class="absolute left-0 lg:left-auto lg:right-0 top-full mt-2 w-[17rem] max-w-[calc(100vw-2.5rem)] z-40 p-1.5
                   bg-white text-ink rounded-xl shadow-pop origin-top-left lg:origin-top-right
                   transition duration-150 ease-out opacity-0 scale-95 -translate-y-1"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-3xl lg:max-w-5xl mx-auto px-5 lg:px-12 mt-7 lg:mt-9">
    <section id="tab-home" class="tab-panel hidden"></section>
    <section id="tab-calendar" class="tab-panel hidden"></section>
    <section id="tab-homework" class="tab-panel hidden"></section>
    <section id="tab-timetable" class="tab-panel hidden"></section>
    <section id="tab-absences" class="tab-panel hidden"></section>
    <section id="tab-reminders" class="tab-panel hidden"></section>
    <section id="tab-noticeboard" class="tab-panel hidden"></section>
    <p id="updated-at" class="text-xs text-ink-faint mt-12"></p>
  </main>

  <aside class="hidden lg:flex fixed inset-y-0 left-0 w-60 z-40 flex-col bg-white border-r border-slate-200 px-3 pt-6 pb-5">
    <div class="flex items-center gap-2.5 px-3">
      <img src="/logo.svg" alt="" width="30" height="30">
      <span class="font-extrabold tracking-tight">Registro</span>
    </div>
    <nav id="side-nav" class="mt-8 flex flex-col gap-0.5"></nav>
    <div class="mt-auto px-3">
      <p id="side-name" class="font-bold text-sm truncate"></p>
      <p id="side-meta" class="text-xs text-ink-faint truncate"></p>
      <button data-action="logout"
        class="mt-3 -ml-2 inline-flex items-center gap-2 rounded-lg px-2 py-1.5 text-sm font-semibold text-ink-soft
               hover:text-rose-600 transition focus-visible:outline focus-visible:outline-2
               focus-visible:outline-rose-500">
        <span data-icon="logout" data-icon-size="w-4 h-4"></span> Esci
      </button>
    </div>
  </aside>

  <!-- docked to the bottom edge and padded by the safe area, so nothing of the
       page shows through under the phone's gesture bar -->
  <nav class="fixed bottom-0 inset-x-0 z-30 lg:hidden bg-white border-t border-slate-200
              pb-[env(safe-area-inset-bottom,0px)]">
    <div class="mx-auto w-full max-w-md grid grid-cols-4 px-2">
      <button data-tab="home" class="tab" data-icon="home" data-label="Home"></button>
      <button data-tab="homework" class="tab" data-icon="check" data-label="Compiti"></button>
      <button data-tab="calendar" class="tab" data-icon="calendar" data-label="Calendario"></button>
      <button data-tab="timetable" class="tab" data-icon="clock" data-label="Orario"></button>
    </div>
  </nav>
</div>

<dialog id="logout-dialog" class="modal w-[min(22rem,calc(100vw-2.5rem))]">
  <div class="p-6">
    <h2 class="text-lg font-extrabold tracking-tight">Vuoi uscire?</h2>
    <p class="text-sm text-ink-soft mt-1.5">
      La sessione viene chiusa e dovrai reinserire codice scuola, utente e password per rientrare.
    </p>
    <div class="flex gap-2 mt-6">
      <button id="logout-cancel" class="btn btn-quiet flex-1">Annulla</button>
      <button id="logout-confirm" class="btn btn-danger flex-1">Esci</button>
    </div>
  </div>
</dialog>

<dialog id="note-dialog" class="modal w-[min(24rem,calc(100vw-2.5rem))]">
  <div class="p-6">
    <h2 id="note-subject" class="text-lg font-extrabold tracking-tight"></h2>
    <p id="note-text" class="text-sm text-ink-soft mt-1.5 line-clamp-3 whitespace-pre-wrap"></p>
    <label class="block mt-5">
      <span class="text-[13px] font-semibold text-ink-soft">La tua nota</span>
      <textarea id="note-input" rows="4" maxlength="2000" placeholder="Pagine, esercizi, cose da ricordare…"
        class="field resize-y"></textarea>
    </label>
    <div class="flex gap-2 mt-6">
      <button id="note-delete" class="hidden btn btn-ghost-danger">Elimina</button>
      <button id="note-cancel" class="btn btn-quiet flex-1">Annulla</button>
      <button id="note-save" class="btn btn-primary flex-1">Salva</button>
    </div>
  </div>
</dialog>

<dialog id="slot-dialog" class="modal w-[min(24rem,calc(100vw-2.5rem))]">
  <form id="slot-form" class="p-6" novalidate>
    <h2 id="slot-title" class="text-lg font-extrabold tracking-tight">Nuova ora</h2>
    <p id="slot-day" class="text-sm text-ink-soft mt-1"></p>
    <div class="grid grid-cols-2 gap-3 mt-5">
      <label class="block">
        <span class="text-[13px] font-semibold text-ink-soft">Dalle</span>
        <input id="slot-start" type="time" required step="300" class="field">
      </label>
      <label class="block">
        <span class="text-[13px] font-semibold text-ink-soft">Alle</span>
        <input id="slot-end" type="time" required step="300" class="field">
      </label>
    </div>
    <label class="block mt-3">
      <span class="text-[13px] font-semibold text-ink-soft">Materia</span>
      <input id="slot-subject" list="subjects-list" required maxlength="60" autocomplete="off" placeholder="Matematica"
        class="field">
      <datalist id="subjects-list"></datalist>
    </label>
    <p id="slot-error" class="hidden mt-3 text-sm text-rose-700 border border-rose-200 rounded-lg px-3.5 py-2.5"></p>
    <div class="flex gap-2 mt-6">
      <button type="button" id="slot-delete" class="hidden btn btn-ghost-danger">Elimina</button>
      <button type="button" id="slot-cancel" class="btn btn-quiet flex-1">Annulla</button>
      <button type="submit" id="slot-save" class="btn btn-primary flex-1">Salva</button>
    </div>
  </form>
</dialog>

<script src="/app.js?v=27"></script>
</body>
</html>
