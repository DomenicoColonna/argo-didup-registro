[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# the frontend talks to /api/*, on netlify that becomes a function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# keeps the free Supabase project awake (it pauses after 7 days without traffic)
[functions.keepalive]
  schedule = "@daily"
